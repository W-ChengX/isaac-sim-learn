site_name: Isaac Sim Learn
site_description: Isaac Sim 中文自学笔记（主路径 5.1.0，对照 6.0.1/latest）
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - 导读: index.md
  - 术语表: 术语表.md
  - 00 前置与安装: 00_前置与安装/index.md
  - 01 第一次仿真: 01_第一次仿真/index.md
  - 02 第一次机器人: 02_第一次机器人/index.md
  - 03 USD与Omniverse: 03_USD与Omniverse/index.md
  - 04 Python接口: 04_Python接口/index.md
  - 05 扩展开发: 05_扩展开发/index.md
  - 06 ROS2集成: 06_ROS2集成/index.md
  - 07 Isaac Lab: 07_Isaac_Lab/index.md
  - 08 SDG与传感器: 08_SDG与传感器/index.md
  - 迁移 5到6: 迁移_5到6/index.md
  - 常见坑: 常见坑/index.md
  - 速查表: 速查表/index.md
  - 资源链接: 资源链接.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
